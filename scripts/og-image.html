<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Ảnh Open Graph của website</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #14141a;
      --ink: #f4f4f6;
      --muted: #c4c6d0;
      --brand: #a38bf5;
      --brand-2: #6aa9e9;
    }
    body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink);
           font-family: 'Inter', system-ui, sans-serif; }
    .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px;
            background: radial-gradient(900px 420px at 100% 0%, rgba(163, 139, 245, 0.28), transparent 70%), var(--paper); }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 22px; font-weight: 600;
               letter-spacing: 0.2em; text-transform: uppercase; color: var(--brand); }
    h1 { margin-top: 28px; font-size: 104px; font-weight: 800; line-height: 1.04; letter-spacing: -0.03em; }
    h1 .grad { background: linear-gradient(120deg, var(--brand) 20%, var(--brand-2));
               -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { margin-top: 26px; font-size: 38px; font-weight: 500; line-height: 1.3; color: var(--muted); }

    .path { position: absolute; left: 72px; right: 72px; bottom: 112px; height: 64px; }
    .path .line { position: absolute; left: 32px; right: 32px; top: 31px; height: 2px; background: rgba(244, 244, 246, 0.35); }
    .stages { position: absolute; inset: 0; display: flex; justify-content: space-between; }
    .dot { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: 800;
           background: var(--paper); border: 3px solid var(--ink); color: var(--ink); position: relative; z-index: 1; }
    .dot.main { background: var(--brand); border-color: var(--brand); color: #14141a; }
    .dot.opt { border-style: dashed; border-color: var(--brand); color: var(--brand); }

    .foot { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; justify-content: space-between;
            font-size: 24px; font-weight: 500; color: var(--muted); }
    .foot b { color: var(--ink); font-weight: 700; }
    .foot .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Lộ trình học · Tiếng Việt</p>
    <h1>.NET Backend:<br><span class="grad">Zero → Senior</span></h1>
    <p class="sub">Từ tư duy lập trình tới hệ phân tán và microservices.</p>

    <div class="path" aria-hidden="true">
      <div class="line"></div>
      <div class="stages">
        <span class="dot main">1</span><span class="dot main">2</span><span class="dot main">3</span><span class="dot main">4</span>
        <span class="dot opt">5</span><span class="dot opt">6</span>
      </div>
    </div>

    <div class="foot">
      <span><b>6 giai đoạn</b> · 19 module · 4 dự án</span>
      <span class="mono">dotnet-course.tiennhm.io.vn</span>
    </div>
  </div>
</body>
</html>
