<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dependency inversion: dữ liệu ra ngoài, phụ thuộc vào trong</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #f4f4f4;
      --color-muted:  #d4d8de;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <!-- contrast-pass-v1 -->
  <div class="frame">
    <p class="eyebrow">Architecture · Clean Architecture</p>
    <h1>Dependency inversion: dữ liệu ra ngoài, phụ thuộc vào trong</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 554" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dep-inv-dark-title dep-inv-dark-desc">
  <title id="dep-inv-dark-title">Dependency inversion giữa Application và Infrastructure</title>
  <desc id="dep-inv-dark-desc">CreateLeadHandler gọi interface ILeadRepository do Application định nghĩa; EfLeadRepository ở Infrastructure cài đặt interface đó và truy vấn SQL Server; Program.cs là composition root duy nhất nối interface với implementation; dữ liệu chảy ra ngoài còn phụ thuộc chỉ hướng vào trong.</desc>

  </defs>
  <rect width="100%" height="100%" fill="#1b1b1d"/>

  <!-- Zones -->

  <text font-weight="500" x="56" y="53" fill="#d4d8de" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VÒNG TRONG · DOMAIN + APPLICATION</text>

  <text font-weight="500" x="576" y="53" fill="#d4d8de" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VÒNG NGOÀI · API + INFRASTRUCTURE</text>

  <!-- Arrows first -->
  <line x1="280" y1="140" x2="224" y2="140" stroke="#d4d8de" stroke-width="1.6" marker-end="url(#dep-inv-dark-arrow)"/>

  <rect x="229.5" y="119" width="45" height="14" rx="2" fill="#1b1b1d"/><text font-weight="500" x="252" y="129" fill="#d4d8de" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DÙNG</text>
  <rect x="296" y="197" width="40" height="14" rx="2" fill="#1b1b1d"/><text font-weight="500" x="316" y="207" fill="#d4d8de" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">GỌI</text>
  <rect x="495" y="247" width="74" height="14" rx="2" fill="#1b1b1d"/><text font-weight="500" x="532" y="257" fill="#3fd9b5" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÀI ĐẶT</text>
  <rect x="481.5" y="183" width="93" height="14" rx="2" fill="#1b1b1d"/><text font-weight="500" x="528" y="193" fill="#d4d8de" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NỐI DÂY DI</text>

  <!-- Domain -->
  <rect x="64" y="112" width="160" height="56" rx="6" fill="#242526" stroke="#f4f4f4" stroke-width="1.5"/>
  <text x="144" y="137" fill="#f4f4f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lead, Money</text>
  <text font-weight="500" x="144" y="153" fill="#d4d8de" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">Crm.Domain</text>

  <text font-weight="500" x="380" y="153" fill="#d4d8de" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">Crm.Application</text>

  <rect x="280" y="240" width="200" height="56" rx="6" fill="#1b1b1d"/>
  <rect x="280" y="240" width="200" height="56" rx="6" fill="rgba(37,193,159,0.15)" stroke="#3fd9b5" stroke-width="1.5"/>
  <text x="380" y="265" fill="#f4f4f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ILeadRepository</text>
  <text font-weight="500" x="380" y="281" fill="#d4d8de" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">port · interface</text>

  <text x="744" y="137" fill="#f4f4f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Program.cs</text>
  <text font-weight="500" x="744" y="153" fill="#d4d8de" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">Crm.Api · composition root</text>

  <rect x="584" y="240" width="180" height="56" rx="6" fill="#242526" stroke="#f4f4f4" stroke-width="1.5"/>
  <text x="674" y="265" fill="#f4f4f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EfLeadRepository</text>
  <text font-weight="500" x="674" y="281" fill="#d4d8de" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">adapter · EF Core</text>

  <rect x="808" y="240" width="96" height="56" rx="6" fill="rgba(227,227,227,0.05)" stroke="#d4d8de" stroke-width="1.5"/>
  <text x="856" y="265" fill="#f4f4f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQL Server</text>
  <text font-weight="500" x="856" y="281" fill="#d4d8de" font-size="10.5" font-family="'Geist Mono', monospace" text-anchor="middle">database</text>

  <!-- Two directions -->
  <text x="40" y="380" fill="#f4f4f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Dòng chảy dữ liệu</text>
  <text font-weight="500" x="320" y="380" fill="#d4d8de" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">Application</text>
  <line x1="336" y1="376" x2="704" y2="376" stroke="#d4d8de" stroke-width="1.6" marker-end="url(#dep-inv-dark-arrow)"/>
  <text font-weight="500" x="720" y="380" fill="#d4d8de" font-size="12" font-family="'Geist Mono', monospace">Database</text>
  <text x="40" y="420" fill="#f4f4f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Dòng chảy phụ thuộc</text>
  <text font-weight="500" x="320" y="420" fill="#d4d8de" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">Application</text>
  <line x1="704" y1="416" x2="336" y2="416" stroke="#3fd9b5" stroke-width="1.4" marker-end="url(#dep-inv-dark-arrow-accent)"/>
  <text font-weight="500" x="720" y="420" fill="#d4d8de" font-size="12" font-family="'Geist Mono', monospace">Infrastructure</text>

  <!-- Legend -->
  <line x1="40" y1="456" x2="920" y2="456" stroke="rgba(227,227,227,0.18)" stroke-width="0.8"/>
  <text font-weight="500" x="40" y="476" fill="#d4d8de" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
  <line x1="40" y1="498" x2="68" y2="498" stroke="#3fd9b5" stroke-width="1.4" marker-end="url(#dep-inv-dark-arrow-accent)"/>
  <text x="76" y="501" fill="#d4d8de" font-size="8.5" font-family="'Geist', sans-serif">Phụ thuộc hướng vào trong</text>
  <line x1="260" y1="498" x2="288" y2="498" stroke="#d4d8de" stroke-width="1.6" marker-end="url(#dep-inv-dark-arrow)"/>
  <text x="296" y="501" fill="#d4d8de" font-size="8.5" font-family="'Geist', sans-serif">Gọi / dùng</text>
  <line x1="420" y1="498" x2="448" y2="498" stroke="#d4d8de" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#dep-inv-dark-arrow)"/>
  <text x="456" y="501" fill="#d4d8de" font-size="8.5" font-family="'Geist', sans-serif">Composition root đăng ký DI</text>
  <rect x="660" y="492" width="24" height="12" rx="2" fill="rgba(37,193,159,0.15)" stroke="#3fd9b5" stroke-width="1.5"/>
