<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mất dữ liệu hay cứu được</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:ital,wght@0,400;0,500;0,600;1,400&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #101215;
      --color-muted:  #383e46;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <!-- contrast-pass-v1 -->
  <div class="frame">
    <p class="eyebrow">Flowchart · An toàn</p>
    <h1>Mất dữ liệu hay cứu được</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="git-loss-decision-title git-loss-decision-desc">
  <title id="git-loss-decision-title">Mất dữ liệu hay cứu được</title>
  <desc id="git-loss-decision-desc">Sau một thao tác Git, nếu thay đổi đã commit thì cứu được bằng reflog trong khoảng 30 ngày; nếu chưa commit thì các lệnh git reset --hard, git clean -fd và git restore file làm mất thay đổi vĩnh viễn.</desc>
  <defs><marker id="git-loss-decision-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#383e46"/></marker><marker id="git-loss-decision-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d6f58"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <path d="M200,176 L272,176" fill="none" stroke="#383e46" stroke-width="1.6" marker-end="url(#git-loss-decision-arrow)"/>
    <path d="M360,120 V84 Q360,76 368,76 H520" fill="none" stroke="#383e46" stroke-width="1.6" marker-end="url(#git-loss-decision-arrow)"/>
    <rect x="426" y="55" width="36" height="14" rx="2" fill="#ffffff"/><text font-weight="500" x="444" y="65" fill="#383e46" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RỒI</text>
    <path d="M360,232 V292 Q360,300 368,300 H520" fill="none" stroke="#383e46" stroke-width="1.6" marker-end="url(#git-loss-decision-arrow)"/>
    <rect x="422.5" y="279" width="43" height="14" rx="2" fill="#ffffff"/><text font-weight="500" x="444" y="289" fill="#383e46" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHƯA</text>
    <path d="M720,300 L788,300" fill="none" stroke="#383e46" stroke-width="1.6" marker-end="url(#git-loss-decision-arrow)"/>
    <rect x="40" y="140" width="160" height="72" rx="6" fill="#ffffff"/><rect x="40" y="140" width="160" height="72" rx="6" fill="#ffffff" stroke="#101215" stroke-width="1.5"/><text x="120" y="180.5" fill="#101215" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thao tác Git</text>
    <polygon points="272,176 360,120 448,176 360,232" fill="#ffffff"/><polygon points="272,176 360,120 448,176 360,232" fill="#ffffff" stroke="#101215" stroke-width="1.5"/>
    <text x="360" y="174" fill="#101215" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đã commit</text>
    <text x="360" y="192" fill="#101215" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chưa?</text>
    <rect x="520" y="40" width="240" height="72" rx="6" fill="#ffffff"/><rect x="520" y="40" width="240" height="72" rx="6" fill="rgba(24,129,106,0.11)" stroke="#0d6f58" stroke-width="1.5"/><text x="640" y="71.5" fill="#101215" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cứu được bằng reflog</text><text font-weight="500" x="640" y="89.5" fill="#383e46" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">trong khoảng 30 ngày</text>
    <rect x="520" y="252" width="200" height="96" rx="6" fill="#ffffff"/><rect x="520" y="252" width="200" height="96" rx="6" fill="#ffffff" stroke="#101215" stroke-width="1.5"/>
    <text x="620" y="282" fill="#101215" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chưa commit</text>
    <text x="620" y="304" fill="#383e46" font-size="11" font-weight="400" font-family="'Geist Mono', monospace" text-anchor="middle">git reset --hard</text>
    <text x="620" y="321" fill="#383e46" font-size="11" font-weight="400" font-family="'Geist Mono', monospace" text-anchor="middle">git clean -fd</text>
    <text x="620" y="338" fill="#383e46" font-size="11" font-weight="400" font-family="'Geist Mono', monospace" text-anchor="middle">git restore &lt;file&gt;</text>
    <rect x="788" y="264" width="132" height="72" rx="6" fill="#ffffff"/><rect x="788" y="264" width="132" height="72" rx="6" fill="#101215" stroke="#101215" stroke-width="1.5"/>
    <text x="854" y="296" fill="#ffffff" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MẤT</text>
    <text x="854" y="314" fill="#ffffff" font-size="12" font-weight="400" font-family="'Geist', sans-serif" text-anchor="middle">không cứu được</text>
    <line x1="40" y1="392" x2="920" y2="392" stroke="rgba(28,30,33,0.16)" stroke-width="0.8"/><text font-weight="500" x="40" y="412" fill="#383e46" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text><rect x="40" y="424" width="28" height="12" rx="2" fill="rgba(24,129,106,0.11)" stroke="#0d6f58" stroke-width="1.5"/><text x="76" y="433.5" fill="#383e46" font-size="12" font-family="'Geist', sans-serif">An toàn</text><rect x="160" y="424" width="28" height="12" rx="2" fill="#ffffff" stroke="#101215" stroke-width="1.5"/><text x="196" y="433.5" fill="#383e46" font-size="12" font-family="'Geist', sans-serif">Điểm kiểm tra</text><line x1="314" y1="430" x2="342" y2="430" stroke="#383e46" stroke-width="1.6" marker-end="url(#git-loss-decision-arrow)"/><text x="350" y="433.5" fill="#383e46" font-size="12" font-family="'Geist', sans-serif">Rẽ nhánh theo câu trả lời</text>
<text id="tiennhm-copyright" x="936" y="464" text-anchor="end" fill="#383e46" opacity="0.75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">© tiennhm</text>
</svg>
    </div>
  </div>
</body>
</html>
