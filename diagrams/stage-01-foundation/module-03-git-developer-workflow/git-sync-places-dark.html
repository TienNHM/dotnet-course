<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đồng bộ giữa máy và GitHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:ital,wght@0,400;0,500;0,600;1,400&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #f4f4f4;
      --color-muted:  #d4d8de;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <!-- contrast-pass-v1 -->
  <div class="frame">
    <p class="eyebrow">Process · Đồng bộ</p>
    <h1>Đồng bộ giữa máy và GitHub</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="git-sync-places-dark-title git-sync-places-dark-desc">

  <rect width="100%" height="100%" fill="#1b1b1d"/>
  <path d="M248,76 L376,76" fill="none" stroke="#d4d8de" stroke-width="1.6" marker-end="url(#git-sync-places-dark-arrow)"/>

    <path d="M584,76 L712,76" fill="none" stroke="#d4d8de" stroke-width="1.6" marker-end="url(#git-sync-places-dark-arrow)"/>

    <path d="M816.0,112 L816.0,200" fill="none" stroke="#d4d8de" stroke-width="1.6" marker-end="url(#git-sync-places-dark-arrow)"/>
    <rect x="813" y="149" width="78" height="14" rx="2" fill="#1b1b1d"/><text font-weight="500" x="852" y="159" fill="#d4d8de" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIT FETCH</text>
    <path d="M712,236 H488.0 Q480.0,236 480.0,228 V112" fill="none" stroke="#d4d8de" stroke-width="1.6" marker-end="url(#git-sync-places-dark-arrow)"/>
    <rect x="539" y="215" width="114" height="14" rx="2" fill="#1b1b1d"/><text font-weight="500" x="596" y="225" fill="#d4d8de" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MERGE / REBASE</text>
    <rect x="40" y="40" width="208" height="72" rx="6" fill="#1b1b1d"/><rect x="40" y="40" width="208" height="72" rx="6" fill="#242526" stroke="#f4f4f4" stroke-width="1.5"/><text x="144" y="80.5" fill="#f4f4f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thư mục làm việc</text>
    <rect x="376" y="40" width="208" height="72" rx="6" fill="#1b1b1d"/><rect x="376" y="40" width="208" height="72" rx="6" fill="#242526" stroke="#f4f4f4" stroke-width="1.5"/><text x="480" y="71.5" fill="#f4f4f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kho trên máy</text><text font-weight="500" x="480" y="89.5" fill="#d4d8de" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">nhánh main</text>
    <rect x="712" y="40" width="208" height="72" rx="6" fill="#1b1b1d"/><rect x="712" y="40" width="208" height="72" rx="6" fill="rgba(227,227,227,0.05)" stroke="rgba(227,227,227,0.50)" stroke-width="1.5" stroke-dasharray="4,3"/><text x="816" y="71.5" fill="#f4f4f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kho trên GitHub</text><text font-weight="500" x="816" y="89.5" fill="#d4d8de" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">origin</text>
    <rect x="712" y="200" width="208" height="72" rx="6" fill="#1b1b1d"/><rect x="712" y="200" width="208" height="72" rx="6" fill="rgba(37,193,159,0.15)" stroke="#3fd9b5" stroke-width="1.5"/><text x="816" y="231.5" fill="#f4f4f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">origin/main</text><text font-weight="500" x="816" y="249.5" fill="#d4d8de" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">bản ghi nhớ trên máy</text>
    <line x1="40" y1="308" x2="920" y2="308" stroke="rgba(227,227,227,0.18)" stroke-width="0.8"/><text font-weight="500" x="40" y="328" fill="#d4d8de" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text><rect x="40" y="340" width="28" height="12" rx="2" fill="rgba(37,193,159,0.15)" stroke="#3fd9b5" stroke-width="1.5"/><text x="76" y="349.5" fill="#d4d8de" font-size="12" font-family="'Geist', sans-serif">Bản ghi nhớ, chỉ cập nhật khi fetch</text><rect x="314" y="340" width="28" height="12" rx="2" fill="rgba(227,227,227,0.05)" stroke="rgba(227,227,227,0.50)" stroke-width="1.5" stroke-dasharray="4,3"/><text x="350" y="349.5" fill="#d4d8de" font-size="12" font-family="'Geist', sans-serif">Ở xa, trên GitHub</text><line x1="488" y1="346" x2="516" y2="346" stroke="#d4d8de" stroke-width="1.6" marker-end="url(#git-sync-places-dark-arrow)"/><text x="524" y="349.5" fill="#d4d8de" font-size="12" font-family="'Geist', sans-serif">Hướng dữ liệu đi</text>
<text id="tiennhm-copyright" x="936" y="384" text-anchor="end" fill="#d4d8de" opacity="0.75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">© tiennhm</text>
</svg>
    </div>
  </div>
</body>
</html>
