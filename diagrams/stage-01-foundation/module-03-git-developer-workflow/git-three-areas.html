<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ba vùng của Git</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=Geist:ital,wght@0,400;0,500;0,600;1,400&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #101215;
      --color-muted:  #383e46;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <!-- contrast-pass-v1 -->
  <div class="frame">
    <p class="eyebrow">Process · Working, staging, repository</p>
    <h1>Ba vùng của Git</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 324" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="git-three-areas-title git-three-areas-desc">
  <title id="git-three-areas-title">Ba vùng của Git</title>
  <desc id="git-three-areas-desc">File đi từ working directory qua git add vào staging area, qua git commit vào repository; git restore hoặc git switch đưa nội dung từ repository về lại working directory.</desc>
  <defs><marker id="git-three-areas-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#383e46"/></marker><marker id="git-three-areas-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d6f58"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <path d="M248,84.0 L376,84.0" fill="none" stroke="#383e46" stroke-width="1.6" marker-end="url(#git-three-areas-arrow)"/>
    <rect x="280.5" y="63" width="63" height="14" rx="2" fill="#ffffff"/><text font-weight="500" x="312" y="73" fill="#383e46" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">git add</text>
    <path d="M584,84.0 L712,84.0" fill="none" stroke="#383e46" stroke-width="1.6" marker-end="url(#git-three-areas-arrow)"/>
    <rect x="605.5" y="63" width="85" height="14" rx="2" fill="#ffffff"/><text font-weight="500" x="648" y="73" fill="#383e46" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">git commit</text>
    <path d="M816.0,128 V160 Q816.0,168 808.0,168 H152.0 Q144.0,168 144.0,160 V128" fill="none" stroke="#383e46" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#git-three-areas-arrow)"/>
    <rect x="388" y="177" width="184" height="14" rx="2" fill="#ffffff"/><text font-weight="500" x="480" y="187" fill="#383e46" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">git restore / git switch</text>
    <rect x="40" y="40" width="208" height="88" rx="6" fill="#ffffff"/><rect x="40" y="40" width="208" height="88" rx="6" fill="#ffffff" stroke="#101215" stroke-width="1.5"/><text x="144" y="79.5" fill="#101215" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Working directory</text><text font-weight="500" x="144" y="97.5" fill="#383e46" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">file bạn đang sửa</text>
    <rect x="376" y="40" width="208" height="88" rx="6" fill="#ffffff"/><rect x="376" y="40" width="208" height="88" rx="6" fill="rgba(24,129,106,0.11)" stroke="#0d6f58" stroke-width="1.5"/><text x="480" y="79.5" fill="#101215" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Staging area</text><text font-weight="500" x="480" y="97.5" fill="#383e46" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">chọn phần sẽ commit</text>
    <rect x="712" y="40" width="208" height="88" rx="6" fill="#ffffff"/><rect x="712" y="40" width="208" height="88" rx="6" fill="#ffffff" stroke="#101215" stroke-width="1.5"/><text x="816" y="79.5" fill="#101215" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repository</text><text font-weight="500" x="816" y="97.5" fill="#383e46" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">lịch sử vĩnh viễn</text>
    <line x1="40" y1="228" x2="920" y2="228" stroke="rgba(28,30,33,0.16)" stroke-width="0.8"/><text font-weight="500" x="40" y="248" fill="#383e46" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text><rect x="40" y="260" width="28" height="12" rx="2" fill="rgba(24,129,106,0.11)" stroke="#0d6f58" stroke-width="1.5"/><text x="76" y="269.5" fill="#383e46" font-size="12" font-family="'Geist', sans-serif">Vùng trung gian dễ nhầm</text><line x1="254" y1="266" x2="282" y2="266" stroke="#383e46" stroke-width="1.6" marker-end="url(#git-three-areas-arrow)"/><text x="290" y="269.5" fill="#383e46" font-size="12" font-family="'Geist', sans-serif">Lưu lại</text><line x1="370" y1="266" x2="398" y2="266" stroke="#383e46" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#git-three-areas-arrow)"/><text x="406" y="269.5" fill="#383e46" font-size="12" font-family="'Geist', sans-serif">Quay về / lấy ra</text>
<text font-weight="500" id="tiennhm-copyright" x="936" y="312" text-anchor="end" fill="#383e46" opacity="0.75" font-size="10.5" font-family="'Geist Mono', monospace" letter-spacing="0.08em">© tiennhm</text>
</svg>
    </div>
  </div>
</body>
</html>
